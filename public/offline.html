<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090c">
  <title>Hors connexion — Vidzy par Madra</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#26205c,#08090c 55%);color:#fff}.card{width:min(520px,100%);padding:42px;border:1px solid #ffffff20;border-radius:24px;background:#101218dd;text-align:center;box-shadow:0 30px 80px #0008}.logo{display:grid;place-items:center;width:64px;height:64px;margin:auto;border-radius:18px;background:#765cff;font-size:30px;font-weight:900}h1{margin:24px 0 10px;font-size:36px}p{color:#a9acb5;line-height:1.7}button{margin-top:18px;border:0;border-radius:999px;padding:13px 22px;background:#765cff;color:#fff;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">V</div>
    <h1>Vous êtes hors connexion</h1>
    <p>Vidzy ne peut pas charger le catalogue sans réseau. Vérifiez votre connexion, puis réessayez.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
